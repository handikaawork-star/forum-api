# Forum API - NGINX reverse proxy config (deployed on GCP e2-micro VM)
# Live at /etc/nginx/sites-available/forum-api, symlinked into sites-enabled.
# HTTPS block below was generated by: certbot --nginx -d forum-api-testing.my.id

# Rate limit zone: max 90 requests/minute per client IP, applied only to /threads
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    server_name forum-api-testing.my.id;

    ssl_certificate /etc/letsencrypt/live/forum-api-testing.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/forum-api-testing.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location /threads {
        limit_req zone=threads_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name forum-api-testing.my.id;

    if ($host = forum-api-testing.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
