name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      HOST: localhost
      PORT: 5000
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: developer
      PGPASSWORD: supersecretpassword
      PGDATABASE: forumapi_test
      ACCESS_TOKEN_KEY: ci_access_token_key_for_testing_only
      REFRESH_TOKEN_KEY: ci_refresh_token_key_for_testing_only
      ACCESS_TOKEN_AGE: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database env file
        run: echo "DATABASE_URL=postgres://developer:supersecretpassword@localhost:5432/forumapi_test" > .test.env

      - name: Run database migrations
        run: npm run migrate:test up

      - name: Run Unit Test
        run: npm run test:unit

      - name: Run Integration Test
        run: npm run test:integration

      - name: Run Functional Test
        run: npm run test:functional
